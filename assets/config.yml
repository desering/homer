# YAML schema for IntelliJ:
# $schema: https://raw.githubusercontent.com/bastienwirtz/homer/main/.schema/config-schema.json
# YAML schema for VSCode:
# yaml-language-server: $schema=https://raw.githubusercontent.com/bastienwirtz/homer/main/.schema/config-schema.json

#s Homepage configuration
# See https://fontawesome.com/search for icons options

subtitle: "De Sering: Start"
title: "Home for links and services"
logo: "/assets/media/logos/De Sering Logo/RGB/Mark/de sering logo_m_RED.png"
header: true

footer: false

# Optional theme customization
theme: default

# Optional theme customization (color overrides)
# overrides can also be done using CSS vars
colors:
  light:
    highlight-primary: "#FFFFFF"
    highlight-secondary: "#FB3F2A"
    highlight-hover: "#EBEB47"
    background: "#FFFFFF"
    card-background: "#4A4D20"
    text: "#FFFFFF"
    text-header: "#4A4D20"
    text-title: "#FFFFFF"
    text-subtitle: "#FFFFFF"
    link: "#F3F0EB"
    link-hover: "#EBEB47"
    card-shadow: rgba(251, 63, 42, .2)
  dark:
    highlight-primary: "#000000"
    highlight-secondary: "#494C1A"
    highlight-hover: "#ECEB01"
    background: "#151515"
    card-background: "#2b2b2b"
    text: "#FFFFFF"
    text-header: "#F3F1EC"
    text-title: "#FFFFFF"
    text-subtitle: "#F3F1EC"
    link: "#FF3F00"
    link-hover: "#ECEB01"
    card-shadow: rgba(0, 0, 0, 0.4)

stylesheet:
   - "assets/customizations.css"

# Optional message
message:
  title: "Contribute to this page!"
  style: "is-dark" # See https://bulma.io/documentation/components/message/#colors for styling options.
  icon: "fa-solid fa-compass-drafting"
  content: "You can add links here or have a separate sub-page! Or fix typos, improve style. Link above ↑"

# Optional navbar
# links: [] # Allows for navbar (dark mode, layout, and search) without any links
links:
  - name: "improve this page"
    icon: "fa-solid fa-sliders"
    url: "https://github.com/desering/homer"
    target: "_blank"
  - name: "Tech Circle"
    icon: "fa-solid fa-database"
    url: "#tech-circle"

# Services
# First level array represent a group.
# Leave only an "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
services:
  - name: "Communication and Announcements"
    icon: "fa-regular fa-message"
    items:
      - name: "Schedule"
        icon: "fa-regular fa-calendar-days"
        subtitle: "Manage and discover volunteering shifts"
        url: "https://schedule.desering.org"
        tag: "self-made\n#self-hosted"
        quick:
          - name: "open source"
            url: "https://github.com/desering/volunteer-scheduler"
            icon: "fa-solid fa-arrow-up-right-from-square"
            target: "_blank"

      - name: "Mattermost"
        subtitle: "Main forum for discussions"
        logo: "/assets/logos/Mattermost_icon_black.svg"
        url: "https://mattermost.desering.org/"
        tag: "self-hosted"

      - name: "WhatsApp community"
        subtitle: "Yet another WhatsApp group chat :)"
        icon: "fa-brands fa-whatsapp"
        url: "https://chat.whatsapp.com/IKoCe4CnZsdClRdutZ8soU"
        tag: "external"

  - name: "De Sering community kitchen"
    logo: "/assets/media/logos/De Sering Logo/vector/de sering logo_RED_on_OFFWHITE_bg.svg"
    items:
      - name: "De Sering website"
        icon: "fas fa-globe"
        url: "https://desering.org/"
      - name: "De Sering Facebook"
        icon: "fa-brands fa-square-facebook"
        url: "https://www.facebook.com/DeSeringAmsterdam"
      - name: "De Sering Instagram"
        icon: "fa-brands fa-instagram"
        url: "https://www.instagram.com/de_sering/"
      - name: "De Sering address"
        type: "CopyToClipboard"
        clipboard: "Rhôneweg 6, 1043 AH Amsterdam"
        subtitle: "Rhôneweg 6, 1043 AH Amsterdam"
        icon: "fas fa-map-pin"
        url: "https://maps.app.goo.gl/9XDVTJm8mhULWbdt6"
      - name: "De Sering street parking"
        icon: "fa-solid fa-square-parking"
        type: "CopyToClipboard"
        clipboard: "Rhôneweg 6, 1043 AH Amsterdam"
        subtitle: "gemeente website, copy-paste address"
        url: "https://www.amsterdam.nl/parkeren/parkeertarieven/"

  - name: "De Sering Centraal"
    logo: "/assets/media/logos/De Sering Logo/vector/de sering logo_RED_on_OFFWHITE_bg.svg"
    items:
      - name: "De Sering Centraal website"
        icon: "fas fa-globe"
        url: "https://desering.org/locations/centraal"
      - name: "De Sering Centraal address"
        type: "CopyToClipboard"
        clipboard: "Dijksgracht 6, 1019 BS Amsterdam"
        subtitle: "Dijksgracht 6, 1019 BS Amsterdam"
        icon: "fas fa-map-pin"
        url: "https://maps.app.goo.gl/kzYJ6JwdLh3XjoMj9"
      - name: "De Sering Centraal street parking"
        icon: "fa-solid fa-square-parking"
        type: "CopyToClipboard"
        clipboard: "Dijksgracht 6, 1019 BS Amsterdam"
        subtitle: "gemeente website, copy-paste address"
        url: "https://www.amsterdam.nl/parkeren/parkeertarieven/"

  - name: "Resources and Knowledge"
    icon: "fa-solid fa-book-open-reader"
    items:
      - name: "Wiki"
        subtitle: "Documentation of internal operation and processes"
        icon: "fa-solid fa-book-atlas"
        url: "https://wiki.desering.org/"
        tag: "self-hosted"

      - name: "Brand kit"
        icon: "fa-solid fa-rectangle-ad"
        quick:
          - name: "Google Drive (PDF)"
            url: "https://drive.google.com/file/d/1cpZbjT2V7R74AU87p6CIPUoYdJSy1tiq/view?usp=drive_link"
            icon: "fa-solid fa-arrow-up-right-from-square"
            target: "_blank"
